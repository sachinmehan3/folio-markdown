<script type="text/markdown" id="sample-md"># Orbital Mechanics Notes

A quick reference that exercises **every renderer** in this app: GitHub-flavoured Markdown, syntax-highlighted code, Mermaid diagrams and TeX math.

## 1. Kepler's third law

For a body orbiting a much heavier one, the period $T$ and semi-major axis $a$ are related by

$$
T^2 = \frac{4\pi^2}{G M} a^3
$$

where $G \approx 6.674 \times 10^{-11}\ \mathrm{m^3\,kg^{-1}\,s^{-2}}$. Circular orbital speed is $v = \sqrt{GM/r}$.

The vis-viva equation generalises this to any point on an ellipse:

\[
v^2 = GM\left(\frac{2}{r} - \frac{1}{a}\right)
\]

## 2. Computing a period

```python
import math

G = 6.674e-11          # m^3 kg^-1 s^-2
M_EARTH = 5.972e24     # kg

def orbital_period(a_m: float) -> float:
    """Return the orbital period in seconds for semi-major axis a (metres)."""
    return 2 * math.pi * math.sqrt(a_m**3 / (G * M_EARTH))

iss = orbital_period(6_771_000)
print(f"ISS period: {iss / 60:.1f} min")   # ≈ 92.4 min
```

(() => {
  const $ = (id) => document.getElementById(id);
  const src = $("src"), out = $("out"), statusEl = $("status"), stats = $("stats"), main = $("main");
  const STORE_KEY = "folio-md-draft";
  const VIEW_KEY = "folio-md-view";

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- Math extraction (skips code spans and fences) ---------- */
  const CODE_RE = /^(`{3,}|~{3,})[^\n]*\n[\s\S]*?^\1[ \t]*$|`[^`\n]+`/gm;
  const MATH_RULES = [
    [/\$\$([\s\S]+?)\$\$/g, true],
    [/\\\[([\s\S]+?)\\\]/g, true],
    [/\\\(([\s\S]+?)\\\)/g, false],
    [/\$(?=\S)((?:\\\$|[^$\n])+?)(?<=\S)\$(?!\d)/g, false]
  ];

  function extractMath(text) {
    const math = [];
    const protect = (chunk) => {
      for (const [re, display] of MATH_RULES) {
        chunk = chunk.replace(re, (whole, tex) => {
          math.push({ tex: tex.trim(), display });
          // Keep the line count unchanged so preview blocks still map to source lines.
          return `MATHPH${math.length - 1}ENDPH` + "\n".repeat((whole.match(/\n/g) || []).length);
        });
      }
      return chunk;
    };
    let result = "", last = 0, m;
    CODE_RE.lastIndex = 0;
    while ((m = CODE_RE.exec(text))) {
      result += protect(text.slice(last, m.index)) + m[0];
      last = m.index + m[0].length;
    }
    return { text: result + protect(text.slice(last)), math };
  }

  /* ---------- Table repair ----------
     Pasted tables (often from chat tools) sometimes break a row across several
     lines separated by blank lines:  "| **Cost** | Cheap" / "" / "| Expensive" / "" / "|".
     Stitch those fragments back into one row. Returns the fixed text plus, for each
     output line, the [first, last] source line it came from. */
  const DELIM_RE = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/;
  const countPipes = (s) => (s.replace(/\\\|/g, "").replace(/`[^`]*`/g, "").match(/\|/g) || []).length;

  function repairTables(text) {
    const lines = text.split("\n");
    const out = [], map = [];
    let fence = null;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const f = line.match(/^\s*(`{3,}|~{3,})/);
      if (fence) {
        if (f && f[1][0] === fence[0] && f[1].length >= fence.length) fence = null;
        out.push(line); map.push([i, i]);
        continue;
      }
      if (f) { fence = f[1]; out.push(line); map.push([i, i]); continue; }

      const next = lines[i + 1];
      if (line.includes("|") && next !== undefined && next.includes("|") && DELIM_RE.test(next)) {
        const expected = countPipes(line);
        const closed = line.trim().endsWith("|");
        out.push(line, next); map.push([i, i], [i + 1, i + 1]);
        i += 2;
        while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
          let row = lines[i].trimEnd(), start = i, j = i;
          while (closed && countPipes(row) < expected && !row.endsWith("|")) {
            let k = j + 1;
            while (k < lines.length && !lines[k].trim()) k++;
            if (k >= lines.length || !lines[k].trim().startsWith("|") || countPipes(lines[k]) >= expected) break;
            row += " " + lines[k].trim();
            j = k;
          }
          out.push(row); map.push([start, j]);
          i = j + 1;
        }
        i--;
        continue;
      }
      out.push(line); map.push([i, i]);
    }
    return { text: out.join("\n"), map };
  }

  /* ---------- Marked setup ---------- */
  let mermaidQueue = [];
  const renderer = {
    code(code, info) {
      const lang = (info || "").trim().split(/\s+/)[0].toLowerCase();
      if (lang === "mermaid") {
        mermaidQueue.push(code);
        return `<div class="diagram" data-mermaid="${mermaidQueue.length - 1}"></div>`;
      }
      if (lang === "math" || lang === "latex" || lang === "tex") {
        return `<div class="math-display" data-tex="${escapeHtml(code)}" data-display="1"></div>`;
      }
      let html;
      if (window.hljs && lang && hljs.getLanguage(lang)) {
        html = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
      } else if (window.hljs && !lang) {
        html = hljs.highlightAuto(code).value;
      } else {
        html = escapeHtml(code);
      }
      return `<div class="codeblock"><div class="codeblock-head"><span>${escapeHtml(lang || "text")}</span>` +
        `<button type="button" class="copy">Copy</button></div>` +
        `<pre><code class="hljs">${html}</code></pre></div>`;
    },
    table(header, body) {
      return `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
    }
  };
  marked.use({ gfm: true, breaks: false, renderer });

  /* ---------- Theme ---------- */
  let printing = false;
  const isDark = () => {
    if (printing) return false;
    const t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return matchMedia("(prefers-color-scheme: dark)").matches;
  };

  /* ---------- Render ---------- */
  let generation = 0;
  async function render() {
    const gen = ++generation;
    const raw = src.value;
    const words = (raw.match(/\S+/g) || []).length;
    stats.textContent = `${words.toLocaleString()} words · ${raw.length.toLocaleString()} chars`;

    mermaidQueue = [];
    const repaired = repairTables(raw);
    const { text, math } = extractMath(repaired.text);

    // Render block by block, tagging each with the source lines it came from.
    const tokens = marked.lexer(text);
    let html = "", line = 0;
    for (const tok of tokens) {
      const nl = (tok.raw.match(/\n/g) || []).length;
      if (tok.type !== "space") {
        const last = Math.min(line + Math.max(0, tok.raw.endsWith("\n") ? nl - 1 : nl), repaired.map.length - 1);
        const one = [tok];
        one.links = tokens.links;
        html += `<div class="blk" data-ls="${repaired.map[line][0]}" data-le="${repaired.map[last][1]}">${marked.parser(one)}</div>`;
      }
      line = Math.min(line + nl, repaired.map.length - 1);
    }
    html = html.replace(/MATHPH(\d+)ENDPH/g, (_, i) => {
      const { tex, display } = math[+i];
      return display
        ? `<div class="math-display" data-tex="${escapeHtml(tex)}" data-display="1"></div>`
        : `<span class="math-inline" data-tex="${escapeHtml(tex)}"></span>`;
    });
    // Display math that ended up alone in a paragraph: unwrap it.
    html = html.replace(/<p>\s*(<div class="math-display"[^>]*><\/div>)\s*<\/p>/g, "$1");

    out.innerHTML = window.DOMPurify
      ? DOMPurify.sanitize(html, { ADD_ATTR: ["data-tex", "data-display", "data-mermaid"] })
      : html;

    // Math
    const mathReady = window.MathJax && typeof MathJax.tex2svg === "function";
    out.querySelectorAll("[data-tex]").forEach((el) => {
      const tex = el.getAttribute("data-tex");
      const display = el.hasAttribute("data-display");
      if (!mathReady) {
        el.innerHTML = `<span class="math-raw">${escapeHtml(display ? `$$${tex}$$` : `$${tex}$`)}</span>`;
        return;
      }
      try {
        const node = MathJax.tex2svg(tex, { display });
        const err = node.querySelector("[data-mjx-error]");
        if (err) throw new Error(err.getAttribute("data-mjx-error"));
        el.replaceChildren(node);
      } catch (e) {
        el.innerHTML = `<span class="render-error">TeX error: ${escapeHtml(e.message)}</span>`;
      }
    });

    // Mermaid
    const blocks = [...out.querySelectorAll("[data-mermaid]")];
    if (blocks.length && window.mermaid) {
      statusEl.textContent = "Drawing diagrams…";
      mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "neutral", fontFamily: "IBM Plex Sans, system-ui, sans-serif" });
      for (const el of blocks) {
        const code = mermaidQueue[+el.getAttribute("data-mermaid")];
        try {
          const { svg } = await mermaid.render(`mmd-${gen}-${el.getAttribute("data-mermaid")}`, code);
          if (gen !== generation) return;
          el.innerHTML =
            `<div class="diagram-tools" role="group" aria-label="Diagram size">` +
            `<button type="button" data-zoom="out" aria-label="Smaller">−</button>` +
            `<span class="zoom-val"></span>` +
            `<button type="button" data-zoom="in" aria-label="Larger">+</button>` +
            `<button type="button" data-zoom="fit">Fit</button></div>` +
            `<div class="diagram-body">${svg}</div>`;
          applyZoom(el);
        } catch (e) {
          if (gen !== generation) return;
          el.innerHTML = `<div class="diagram-body"><p class="render-error">Mermaid error: ${escapeHtml(String(e.message || e))}</p></div>`;
          document.querySelectorAll(`[id^="dmmd-${gen}"]`).forEach((n) => n.remove());
        }
      }
    } else if (blocks.length) {
      blocks.forEach((el) => { el.innerHTML = `<p class="render-error">Mermaid library failed to load.</p>`; });
    }
    if (gen === generation) statusEl.textContent = mathReady || !out.querySelector("[data-tex]") ? "Up to date" : "Loading math…";
  }
  window.__rerender = render;

  let timer;
  function schedule() {
    clearTimeout(timer);
    statusEl.textContent = "Typing…";
    timer = setTimeout(() => { render(); store.set(STORE_KEY, src.value); }, 180);
  }

  /* ---------- Wiring ---------- */
  /* ---------- Preview selection → highlight in source ---------- */
  const backdrop = $("backdrop");
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  function clearHighlight() { backdrop.textContent = ""; }

  function highlightSource(s, e) {
    const v = src.value;
    backdrop.style.paddingRight = `${16 + src.offsetWidth - src.clientWidth}px`; // match textarea scrollbar
    backdrop.innerHTML = escapeHtml(v.slice(0, s)) + "<mark>" + escapeHtml(v.slice(s, e)) + "</mark>" + escapeHtml(v.slice(e)) + "\n";
    const mark = backdrop.querySelector("mark");
    src.scrollTop = Math.max(0, mark.offsetTop - src.clientHeight / 3);
    backdrop.scrollTop = src.scrollTop;
  }

  function locateSelection() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    if (!src.offsetParent) return; // editor hidden (Preview view or phone)
    const r = sel.getRangeAt(0);
    if (!out.contains(r.commonAncestorContainer)) return;

    const blocks = out.querySelectorAll(".blk");
    if (!blocks.length) return;
    const blkOf = (n) => (n.nodeType === 1 ? n : n.parentElement)?.closest(".blk");
    const a = blkOf(r.startContainer) || blocks[0];
    const b = blkOf(r.endContainer) || blocks[blocks.length - 1];

    const v = src.value;
    const starts = [0];
    for (let i = 0; i < v.length; i++) if (v[i] === "\n") starts.push(i + 1);
    const from = starts[+a.dataset.ls] ?? 0;
    const le = +b.dataset.le;
    const to = le + 1 < starts.length ? starts[le + 1] - 1 : v.length;
    const region = v.slice(from, to);

    // Match the selected words in order, allowing Markdown syntax (** | ` [ ] etc.) between them.
    const words = sel.toString().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
    const attempts = [words, words.slice(0, 3), words.slice(-3)].filter((w) => w.length);
    for (const w of attempts) {
      const m = new RegExp(w.map(escRe).join("[^\\p{L}\\p{N}]*?"), "iu").exec(region);
      if (m) return highlightSource(from + m.index, from + m.index + m[0].length);
    }
    highlightSource(from, from + region.trimEnd().length); // fall back to the whole block
  }
  out.addEventListener("mouseup", () => setTimeout(locateSelection, 0));
  src.addEventListener("scroll", () => { backdrop.scrollTop = src.scrollTop; });

  src.addEventListener("input", clearHighlight);
  src.addEventListener("input", schedule);
  src.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      src.setRangeText("  ", src.selectionStart, src.selectionEnd, "end");
      schedule();
    }
  });

  /* ---------- Diagram size ----------
     Each diagram starts at "Fit" (its natural size, shrunk to the pane if needed).
     − / + step in 25% increments of the natural size; the choice survives re-renders. */
  const zooms = new Map(); // diagram index → scale, absent = fit
  const ZOOM_STEP = 0.25, ZOOM_MIN = 0.25, ZOOM_MAX = 4;

  function naturalWidth(svg) {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    return (vb && vb.width) || svg.getBoundingClientRect().width || 1;
  }

  function applyZoom(el) {
    const svg = el.querySelector(".diagram-body svg");
    if (!svg) return;
    const natural = naturalWidth(svg);
    const z = zooms.get(el.dataset.mermaid);
    if (z === undefined) {
      svg.style.width = "";
      svg.style.maxWidth = `min(100%, ${natural}px)`;
    } else {
      svg.style.maxWidth = "none";
      svg.style.width = `${natural * z}px`;
    }
    const shown = svg.getBoundingClientRect().width;
    el.querySelector(".zoom-val").textContent = shown ? `${Math.round((shown / natural) * 100)}%` : "Fit";
    el.querySelector('[data-zoom="fit"]').setAttribute("aria-pressed", String(z === undefined));
  }

  out.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-zoom]");
    if (!btn) return;
    const el = btn.closest(".diagram");
    const svg = el.querySelector(".diagram-body svg");
    const key = el.dataset.mermaid;
    if (btn.dataset.zoom === "fit") {
      zooms.delete(key);
    } else {
      const cur = zooms.get(key) ?? svg.getBoundingClientRect().width / naturalWidth(svg);
      const next = btn.dataset.zoom === "in"
        ? Math.floor(cur / ZOOM_STEP + 1e-6) * ZOOM_STEP + ZOOM_STEP
        : Math.ceil(cur / ZOOM_STEP - 1e-6) * ZOOM_STEP - ZOOM_STEP;
      zooms.set(key, Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next)));
    }
    applyZoom(el);
  });

  out.addEventListener("click", async (e) => {
    const btn = e.target.closest(".copy");
    if (!btn) return;
    const code = btn.closest(".codeblock").querySelector("code").innerText;
    try { await navigator.clipboard.writeText(code); btn.textContent = "Copied"; }
    catch { btn.textContent = "Copy blocked"; }
    setTimeout(() => (btn.textContent = "Copy"), 1400);
  });

  function setView(v) {
    main.dataset.view = v;
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    store.set(VIEW_KEY, v);
  }
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));

  // Replace the editor's text as an edit (not by assigning .value), so Ctrl+Z can undo it.
  function replaceAll(t) {
    src.focus();
    let ok = false;
    if (document.activeElement === src) { // hidden in Preview view → can't focus, fall back
      src.select();
      ok = t ? document.execCommand("insertText", false, t) : (src.value === "" || document.execCommand("delete"));
    }
    if (!ok) src.value = t;
    src.setSelectionRange(0, 0);
    src.scrollTop = 0;
  }
  function loadText(t) { replaceAll(t); clearHighlight(); render(); store.set(STORE_KEY, t); }
  $("sample").addEventListener("click", () => loadText($("sample-md").textContent.trim() + "\n"));
  $("clear").addEventListener("click", () => loadText(""));
  $("file").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (f) loadText(await f.text());
    e.target.value = "";
  });

  // PDF: re-render diagrams in light colours, then open the print dialog ("Save as PDF").
  $("pdf").addEventListener("click", async () => {
    clearTimeout(timer);
    printing = true;
    await render();
    const prevTitle = document.title;
    const h1 = out.querySelector("h1");
    if (h1) document.title = h1.textContent.trim();
    statusEl.textContent = "Choose “Save as PDF”";
    try { window.print(); }
    catch { statusEl.textContent = "Printing is blocked here — open index.html directly"; }
    document.title = prevTitle;
    printing = false;
    render();
  });

  document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
  document.addEventListener("drop", async (e) => {
    e.preventDefault();
    document.body.classList.remove("dropping");
    const f = e.dataTransfer.files[0];
    if (f) loadText(await f.text());
  });

  // Re-render diagrams when the theme flips
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---------- Boot ---------- */
  const savedView = store.get(VIEW_KEY);
  if (savedView) setView(savedView);
  const draft = store.get(STORE_KEY);
  src.value = draft && draft.trim() ? draft : $("sample-md").textContent.trim() + "\n";
  render();
})();
</script>
