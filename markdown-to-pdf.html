<script type="text/markdown" id="sample-md"># Orbital Mechanics Notes

A quick reference that exercises **every renderer** in this app: GitHub-flavoured Markdown, syntax-highlighted code, Mermaid diagrams and TeX math.

Jump to [Kepler's third law](#1-keplers-third-law) or the [mission flow](#3-mission-flow), or read more on [Wikipedia](https://en.wikipedia.org/wiki/Kepler%27s_laws_of_planetary_motion).

## 1. Kepler's third law

For a body orbiting a much heavier one, the period $T$ and semi-major axis $a$ are related by

$$
T^2 = \frac{4\pi^2}{G M} a^3
$$

where $G \approx 6.674 \times 10^{-11}\ \mathrm{m^3\,kg^{-1}\,s^{-2}}$. Circular orbital speed is $v = \sqrt{GM/r}$.

The vis-viva equation generalises this to any point on an ellipse:

\[
v^2 = GM\left(\frac{2}{r} - \frac{1}{a}\right)
\]

## 2. Computing a period

```python
import math

G = 6.674e-11          # m^3 kg^-1 s^-2
M_EARTH = 5.972e24     # kg

def orbital_period(a_m: float) -> float:
    """Return the orbital period in seconds for semi-major axis a (metres)."""
    return 2 * math.pi * math.sqrt(a_m**3 / (G * M_EARTH))

iss = orbital_period(6_771_000)
print(f"ISS period: {iss / 60:.1f} min")   # ≈ 92.4 min
```

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const src = $("src"), out = $("out"), statusEl = $("status"), stats = $("stats"), main = $("main");
  const STORE_KEY = "folio-md-draft";
  const VIEW_KEY = "folio-md-view";

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- Math extraction (skips code spans and fences) ---------- */
  const CODE_RE = /^(`{3,}|~{3,})[^\n]*\n[\s\S]*?^\1[ \t]*$|`[^`\n]+`/gm;
  const MATH_RULES = [
    [/\$\$([\s\S]+?)\$\$/g, true],
    [/\\\[([\s\S]+?)\\\]/g, true],
    [/\\\(([\s\S]+?)\\\)/g, false],
    [/\$(?=\S)((?:\\\$|[^$\n])+?)(?<=\S)\$(?!\d)/g, false]
  ];

  function extractMath(text) {
    const math = [];
    const protect = (chunk) => {
      for (const [re, display] of MATH_RULES) {
        chunk = chunk.replace(re, (whole, tex) => {
          math.push({ tex: tex.trim(), display });
          // Keep the line count unchanged so preview blocks still map to source lines.
          return `MATHPH${math.length - 1}ENDPH` + "\n".repeat((whole.match(/\n/g) || []).length);
        });
      }
      return chunk;
    };
    let result = "", last = 0, m;
    CODE_RE.lastIndex = 0;
    while ((m = CODE_RE.exec(text))) {
      result += protect(text.slice(last, m.index)) + m[0];
      last = m.index + m[0].length;
    }
    return { text: result + protect(text.slice(last)), math };
  }

  /* ---------- Table repair ----------
     Pasted tables (often from chat tools) sometimes break a row across several
     lines separated by blank lines:  "| **Cost** | Cheap" / "" / "| Expensive" / "" / "|".
     Stitch those fragments back into one row. Returns the fixed text plus, for each
     output line, the [first, last] source line it came from. */
  const DELIM_RE = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/;
  const countPipes = (s) => (s.replace(/\\\|/g, "").replace(/`[^`]*`/g, "").match(/\|/g) || []).length;

  function repairTables(text) {
    const lines = text.split("\n");
    const out = [], map = [];
    let fence = null;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const f = line.match(/^\s*(`{3,}|~{3,})/);
      if (fence) {
        if (f && f[1][0] === fence[0] && f[1].length >= fence.length) fence = null;
        out.push(line); map.push([i, i]);
        continue;
      }
      if (f) { fence = f[1]; out.push(line); map.push([i, i]); continue; }

      const next = lines[i + 1];
      if (line.includes("|") && next !== undefined && next.includes("|") && DELIM_RE.test(next)) {
        const expected = countPipes(line);
        const closed = line.trim().endsWith("|");
        out.push(line, next); map.push([i, i], [i + 1, i + 1]);
        i += 2;
        while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
          let row = lines[i].trimEnd(), start = i, j = i;
          while (closed && countPipes(row) < expected && !row.endsWith("|")) {
            let k = j + 1;
            while (k < lines.length && !lines[k].trim()) k++;
            if (k >= lines.length || !lines[k].trim().startsWith("|") || countPipes(lines[k]) >= expected) break;
            row += " " + lines[k].trim();
            j = k;
          }
          out.push(row); map.push([start, j]);
          i = j + 1;
        }
        i--;
        continue;
      }
      out.push(line); map.push([i, i]);
    }
    return { text: out.join("\n"), map };
  }

  /* ---------- Marked setup ---------- */
  let mermaidQueue = [];
  const renderer = {
    code(code, info) {
      const lang = (info || "").trim().split(/\s+/)[0].toLowerCase();
      if (lang === "mermaid") {
        mermaidQueue.push(code);
        return `<div class="diagram" data-mermaid="${mermaidQueue.length - 1}"></div>`;
      }
      if (lang === "math" || lang === "latex" || lang === "tex") {
        return `<div class="math-display" data-tex="${escapeHtml(code)}" data-display="1"></div>`;
      }
      let html;
      if (window.hljs && lang && hljs.getLanguage(lang)) {
        html = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
      } else if (window.hljs && !lang) {
        html = hljs.highlightAuto(code).value;
      } else {
        html = escapeHtml(code);
      }
      return `<div class="codeblock"><div class="codeblock-head"><span>${escapeHtml(lang || "text")}</span>` +
        `<button type="button" class="copy">Copy</button></div>` +
        `<pre><code class="hljs">${html}</code></pre></div>`;
    },
    table(header, body) {
      return `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
    },
    // GitHub-style anchors: "## 1. Kepler's law" → id "user-content-1-keplers-law", so
    // [link](#1-keplers-law) works. The prefix keeps them clear of the app's own ids.
    heading(text, level) {
      return `<h${level} id="user-content-${slugify(text)}">${text}</h${level}>`;
    }
  };
  marked.use({ gfm: true, breaks: false, renderer });

  let slugCounts = new Map(); // reset on every render; repeated headings get -1, -2, …
  function slugify(html) {
    const tpl = document.createElement("template");
    tpl.innerHTML = html;
    const base = tpl.content.textContent.trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
    const n = slugCounts.get(base) || 0;
    slugCounts.set(base, n + 1);
    return n ? `${base}-${n}` : base;
  }

  // Links to other pages open in a new tab so the draft isn't navigated away from.
  if (window.DOMPurify) {
    DOMPurify.addHook("afterSanitizeAttributes", (node) => {
      const href = node.tagName === "A" && node.getAttribute("href");
      if (href && !href.startsWith("#")) {
        node.setAttribute("target", "_blank");
        node.setAttribute("rel", "noopener noreferrer");
      }
    });
  }

  /* ---------- Theme ---------- */
  let printing = false;
  const isDark = () => {
    if (printing) return false;
    const t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return matchMedia("(prefers-color-scheme: dark)").matches;
  };

  // Mermaid can't read CSS variables, so the paper/ink palette is repeated here.
  const MERMAID_LIGHT = {
    darkMode: false, fontSize: "14px",
    background: "#fffefb", primaryColor: "#f5f2ec", primaryTextColor: "#1c1b19",
    primaryBorderColor: "#8a8478", secondaryColor: "#eee9df", tertiaryColor: "#faf8f4",
    lineColor: "#6f6a61", textColor: "#1c1b19", edgeLabelBackground: "#fffefb",
    noteBkgColor: "#fbf3e2", noteTextColor: "#1c1b19", noteBorderColor: "#cbc5b8"
  };
  const MERMAID_DARK = {
    darkMode: true, fontSize: "14px",
    background: "#1f1e1b", primaryColor: "#2a2825", primaryTextColor: "#ebe7df",
    primaryBorderColor: "#6f6a61", secondaryColor: "#34312d", tertiaryColor: "#24221f",
    lineColor: "#a39d92", textColor: "#ebe7df", edgeLabelBackground: "#1f1e1b",
    noteBkgColor: "#34312d", noteTextColor: "#ebe7df", noteBorderColor: "#47443e"
  };

  /* ---------- Render ---------- */
  let generation = 0;
  async function render() {
    const gen = ++generation;
    const raw = src.value;
    const words = (raw.match(/\S+/g) || []).length;
    stats.textContent = `${words.toLocaleString()} words · ${raw.length.toLocaleString()} chars`;

    mermaidQueue = [];
    slugCounts = new Map();
    const repaired = repairTables(raw);
    const { text, math } = extractMath(repaired.text);

    // Render block by block, tagging each with the source lines it came from.
    const tokens = marked.lexer(text);
    let html = "", line = 0;
    for (const tok of tokens) {
      const nl = (tok.raw.match(/\n/g) || []).length;
      if (tok.type !== "space") {
        const last = Math.min(line + Math.max(0, tok.raw.endsWith("\n") ? nl - 1 : nl), repaired.map.length - 1);
        const one = [tok];
        one.links = tokens.links;
        html += `<div class="blk" data-ls="${repaired.map[line][0]}" data-le="${repaired.map[last][1]}">${marked.parser(one)}</div>`;
      }
      line = Math.min(line + nl, repaired.map.length - 1);
    }
    html = html.replace(/MATHPH(\d+)ENDPH/g, (_, i) => {
      const { tex, display } = math[+i];
      return display
        ? `<div class="math-display" data-tex="${escapeHtml(tex)}" data-display="1"></div>`
        : `<span class="math-inline" data-tex="${escapeHtml(tex)}"></span>`;
    });
    // Display math that ended up alone in a paragraph: unwrap it.
    html = html.replace(/<p>\s*(<div class="math-display"[^>]*><\/div>)\s*<\/p>/g, "$1");

    out.innerHTML = window.DOMPurify
      ? DOMPurify.sanitize(html, { ADD_ATTR: ["data-tex", "data-display", "data-mermaid"] })
      : html;

    // Math
    const mathReady = window.MathJax && typeof MathJax.tex2svg === "function";
    out.querySelectorAll("[data-tex]").forEach((el) => {
      const tex = el.getAttribute("data-tex");
      const display = el.hasAttribute("data-display");
      if (!mathReady) {
        el.innerHTML = `<span class="math-raw">${escapeHtml(display ? `$$${tex}$$` : `$${tex}$`)}</span>`;
        return;
      }
      try {
        const node = MathJax.tex2svg(tex, { display });
        const err = node.querySelector("[data-mjx-error]");
        if (err) throw new Error(err.getAttribute("data-mjx-error"));
        el.replaceChildren(node);
      } catch (e) {
        el.innerHTML = `<span class="render-error">TeX error: ${escapeHtml(e.message)}</span>`;
      }
    });

    // Mermaid
    const blocks = [...out.querySelectorAll("[data-mermaid]")];
    if (blocks.length && window.mermaid) {
      statusEl.textContent = "Drawing diagrams…";
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "base",
        themeVariables: isDark() ? MERMAID_DARK : MERMAID_LIGHT,
        fontFamily: "Schibsted Grotesk, system-ui, sans-serif"
      });
      for (const el of blocks) {
        const code = mermaidQueue[+el.getAttribute("data-mermaid")];
        try {
          const { svg } = await mermaid.render(`mmd-${gen}-${el.getAttribute("data-mermaid")}`, code);
          if (gen !== generation) return;
          el.innerHTML =
            `<div class="diagram-tools" role="group" aria-label="Diagram controls">` +
            `<button type="button" data-zoom="out" aria-label="Smaller">−</button>` +
            `<span class="zoom-val"></span>` +
            `<button type="button" data-zoom="in" aria-label="Larger">+</button>` +
            `<button type="button" data-zoom="fit">Fit</button>` +
            `<button type="button" class="fs-open" title="Open in full screen">${EXPAND_ICON}Full screen</button></div>` +
            `<div class="diagram-body">${svg}</div>`;
          linkDiagram(el);
          applyZoom(el);
          if (fs.open && viewer.key === el.dataset.mermaid) refreshViewer(el);
        } catch (e) {
          if (gen !== generation) return;
          el.innerHTML = `<div class="diagram-body"><p class="render-error">Mermaid error: ${escapeHtml(String(e.message || e))}</p></div>`;
          document.querySelectorAll(`[id^="dmmd-${gen}"]`).forEach((n) => n.remove());
        }
      }
    } else if (blocks.length) {
      blocks.forEach((el) => { el.innerHTML = `<p class="render-error">Mermaid library failed to load.</p>`; });
    }
    if (gen === generation) statusEl.textContent = mathReady || !out.querySelector("[data-tex]") ? "Up to date" : "Loading math…";
  }
  window.__rerender = render;

  let timer;
  function schedule() {
    clearTimeout(timer);
    statusEl.textContent = "Typing…";
    timer = setTimeout(() => { render(); store.set(STORE_KEY, src.value); }, 180);
  }

  /* ---------- Wiring ---------- */
  /* ---------- Preview selection → highlight in source ---------- */
  const backdrop = $("backdrop");
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  function clearHighlight() { backdrop.textContent = ""; }

  function highlightSource(s, e) {
    const v = src.value;
    const pad = parseFloat(getComputedStyle(src).paddingRight) || 0;
    backdrop.style.paddingRight = `${pad + src.offsetWidth - src.clientWidth}px`; // match textarea scrollbar
    backdrop.innerHTML = escapeHtml(v.slice(0, s)) + "<mark>" + escapeHtml(v.slice(s, e)) + "</mark>" + escapeHtml(v.slice(e)) + "\n";
    const mark = backdrop.querySelector("mark");
    src.scrollTop = Math.max(0, mark.offsetTop - src.clientHeight / 3);
    backdrop.scrollTop = src.scrollTop;
  }

  function locateSelection() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    if (!src.offsetParent) return; // editor hidden (Preview view or phone)
    const r = sel.getRangeAt(0);
    if (!out.contains(r.commonAncestorContainer)) return;

    const blocks = out.querySelectorAll(".blk");
    if (!blocks.length) return;
    const blkOf = (n) => (n.nodeType === 1 ? n : n.parentElement)?.closest(".blk");
    const a = blkOf(r.startContainer) || blocks[0];
    const b = blkOf(r.endContainer) || blocks[blocks.length - 1];

    const v = src.value;
    const starts = [0];
    for (let i = 0; i < v.length; i++) if (v[i] === "\n") starts.push(i + 1);
    const from = starts[+a.dataset.ls] ?? 0;
    const le = +b.dataset.le;
    const to = le + 1 < starts.length ? starts[le + 1] - 1 : v.length;
    const region = v.slice(from, to);

    // Match the selected words in order, allowing Markdown syntax (** | ` [ ] etc.) between them.
    const words = sel.toString().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
    const attempts = [words, words.slice(0, 3), words.slice(-3)].filter((w) => w.length);
    for (const w of attempts) {
      const m = new RegExp(w.map(escRe).join("[^\\p{L}\\p{N}]*?"), "iu").exec(region);
      if (m) return highlightSource(from + m.index, from + m.index + m[0].length);
    }
    highlightSource(from, from + region.trimEnd().length); // fall back to the whole block
  }
  out.addEventListener("mouseup", () => setTimeout(locateSelection, 0));
  src.addEventListener("scroll", () => { backdrop.scrollTop = src.scrollTop; });

  src.addEventListener("input", clearHighlight);
  src.addEventListener("input", schedule);
  src.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      src.setRangeText("  ", src.selectionStart, src.selectionEnd, "end");
      schedule();
    }
  });

  /* ---------- Diagram size ----------
     Each diagram starts at "Fit" (its natural size, shrunk to the pane if needed).
     − / + step in 25% increments of the natural size; the choice survives re-renders. */
  const zooms = new Map(); // diagram index → scale, absent = fit
  const ZOOM_STEP = 0.25, ZOOM_MIN = 0.25, ZOOM_MAX = 4;

  function naturalWidth(svg) {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    return (vb && vb.width) || svg.getBoundingClientRect().width || 1;
  }

  function applyZoom(el) {
    const svg = el.querySelector(".diagram-body svg");
    if (!svg) return;
    const natural = naturalWidth(svg);
    const z = zooms.get(el.dataset.mermaid);
    if (z === undefined) {
      svg.style.width = "";
      svg.style.maxWidth = `min(100%, ${natural}px)`;
    } else {
      svg.style.maxWidth = "none";
      svg.style.width = `${natural * z}px`;
    }
    const shown = svg.getBoundingClientRect().width;
    el.querySelector(".zoom-val").textContent = shown ? `${Math.round((shown / natural) * 100)}%` : "Fit";
    el.querySelector('[data-zoom="fit"]').setAttribute("aria-pressed", String(z === undefined));
  }

  out.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-zoom]");
    if (!btn) return;
    const el = btn.closest(".diagram");
    const svg = el.querySelector(".diagram-body svg");
    const key = el.dataset.mermaid;
    if (btn.dataset.zoom === "fit") {
      zooms.delete(key);
    } else {
      const cur = zooms.get(key) ?? svg.getBoundingClientRect().width / naturalWidth(svg);
      const next = btn.dataset.zoom === "in"
        ? Math.floor(cur / ZOOM_STEP + 1e-6) * ZOOM_STEP + ZOOM_STEP
        : Math.ceil(cur / ZOOM_STEP - 1e-6) * ZOOM_STEP - ZOOM_STEP;
      zooms.set(key, Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next)));
    }
    applyZoom(el);
  });

  /* ---------- Full-screen diagram viewer ----------
     Shows a copy of the diagram in a modal. Wheel / pinch zooms around the pointer,
     dragging pans. The SVG is resized (not CSS-scaled) so text stays crisp at any zoom. */
  const EXPAND_ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>`;
  const fs = $("fs"), stage = $("fs-stage"), canvas = $("fs-canvas"), fsVal = $("fs-val");
  const FS_MIN = 0.1, FS_MAX = 12, FS_STEP = 1.25;
  const viewer = { key: null, w: 1, h: 1, s: 1, x: 0, y: 0 };
  const clampScale = (s) => Math.min(FS_MAX, Math.max(FS_MIN, s));

  function paintViewer() {
    const svg = canvas.firstElementChild;
    if (!svg) return;
    svg.style.width = `${viewer.w * viewer.s}px`;
    svg.style.height = `${viewer.h * viewer.s}px`;
    canvas.style.transform = `translate(${viewer.x}px, ${viewer.y}px)`;
    fsVal.textContent = `${Math.round(viewer.s * 100)}%`;
  }

  // Zoom by `factor`, keeping the stage point (cx, cy) fixed on screen.
  function zoomViewer(factor, cx = stage.clientWidth / 2, cy = stage.clientHeight / 2) {
    const s = clampScale(viewer.s * factor);
    const k = s / viewer.s;
    viewer.x = cx - (cx - viewer.x) * k;
    viewer.y = cy - (cy - viewer.y) * k;
    viewer.s = s;
    paintViewer();
  }

  function centerViewer(s) {
    viewer.s = clampScale(s);
    viewer.x = (stage.clientWidth - viewer.w * viewer.s) / 2;
    viewer.y = (stage.clientHeight - viewer.h * viewer.s) / 2;
    paintViewer();
  }
  const fitViewer = () => centerViewer(Math.min(
    (stage.clientWidth - 48) / viewer.w, (stage.clientHeight - 48) / viewer.h, 4));

  function refreshViewer(el) {
    const svg = el.querySelector(".diagram-body svg");
    if (!svg) return false;
    const vb = svg.viewBox && svg.viewBox.baseVal;
    const box = svg.getBoundingClientRect();
    viewer.w = (vb && vb.width) || box.width || 1;
    viewer.h = (vb && vb.height) || box.height || 1;
    // Mermaid prefixes every internal id (markers, scoped styles) with the root id;
    // rename them so the copy doesn't depend on the original in the preview.
    const tpl = document.createElement("template");
    tpl.innerHTML = svg.id ? svg.outerHTML.split(svg.id).join(`${svg.id}-fs`) : svg.outerHTML;
    canvas.replaceChildren(tpl.content);
    paintViewer();
    return true;
  }

  function openViewer(el) {
    if (!refreshViewer(el)) return;
    viewer.key = el.dataset.mermaid;
    fs.showModal();
    stage.focus();
    fitViewer();
  }

  fs.addEventListener("close", () => { viewer.key = null; canvas.replaceChildren(); });
  out.addEventListener("click", (e) => {
    const btn = e.target.closest(".fs-open");
    if (btn) openViewer(btn.closest(".diagram"));
  });

  fs.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-fs]");
    if (!btn) return;
    const a = btn.dataset.fs;
    if (a === "in") zoomViewer(FS_STEP);
    else if (a === "out") zoomViewer(1 / FS_STEP);
    else if (a === "fit") fitViewer();
    else if (a === "one") centerViewer(1);
    else if (a === "close") fs.close();
  });

  fs.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const pan = { ArrowLeft: [60, 0], ArrowRight: [-60, 0], ArrowUp: [0, 60], ArrowDown: [0, -60] }[e.key];
    if (pan) { viewer.x += pan[0]; viewer.y += pan[1]; paintViewer(); }
    else if (e.key === "+" || e.key === "=") zoomViewer(FS_STEP);
    else if (e.key === "-" || e.key === "_") zoomViewer(1 / FS_STEP);
    else if (e.key === "0") fitViewer();
    else if (e.key === "1") centerViewer(1);
    else return;
    e.preventDefault();
  });

  const stagePoint = (e) => {
    const r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const p = stagePoint(e);
    const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? stage.clientHeight : 1);
    // ctrlKey is set for trackpad pinch, which sends small deltas → zoom faster.
    zoomViewer(Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)), p.x, p.y);
  }, { passive: false });

  stage.addEventListener("dblclick", (e) => {
    const p = stagePoint(e);
    zoomViewer(e.shiftKey ? 0.5 : 2, p.x, p.y);
  });

  // One pointer drags; two pointers pinch-zoom around their midpoint (and pan with it).
  const pointers = new Map();
  let gesture = null;
  function readGesture() {
    const p = [...pointers.values()];
    if (!p.length) return null;
    const cx = p.reduce((t, q) => t + q.x, 0) / p.length;
    const cy = p.reduce((t, q) => t + q.y, 0) / p.length;
    const d = p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0;
    return { cx, cy, d };
  }
  let press = null; // a tap/click on a diagram link follows it; a drag that starts on one doesn't
  stage.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const link = e.target.closest("a[href]");
    press = pointers.size ? null : link && { link, x: e.clientX, y: e.clientY };
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, stagePoint(e));
    gesture = readGesture();
    stage.classList.add("panning");
  });
  stage.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, stagePoint(e));
    const g = readGesture();
    viewer.x += g.cx - gesture.cx;
    viewer.y += g.cy - gesture.cy;
    if (g.d && gesture.d) zoomViewer(g.d / gesture.d, g.cx, g.cy);
    else paintViewer();
    gesture = g;
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    gesture = readGesture();
    if (!pointers.size) stage.classList.remove("panning");
  };
  stage.addEventListener("pointerup", (e) => {
    const tap = press && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 5;
    const href = tap && press.link.getAttribute("href");
    press = null;
    endPointer(e);
    if (href) followLink(href);
  });
  stage.addEventListener("pointercancel", (e) => { press = null; endPointer(e); });
  // Links in the viewer are followed from pointerup above; stop the native click so a drag
  // that ends over a link doesn't navigate. Keyboard activation (detail 0) still works.
  fs.addEventListener("click", (e) => {
    const a = e.target.closest(".fs-canvas a[href]");
    if (!a) return;
    e.preventDefault();
    if (e.detail === 0) followLink(a.getAttribute("href"));
  });

  /* ---------- Links ----------
     "#…" scrolls the preview to that heading/anchor; anything else opens in a new tab.
     Covers Markdown links (target set by the DOMPurify hook) and Mermaid's
     `click Node href "url"` links, which Mermaid renders as <a> elements in the SVG. */
  function safeHref(href) {
    if (href.startsWith("#")) return href;
    try {
      const u = new URL(href, location.href);
      return /^(https?|mailto|tel):$/.test(u.protocol) || u.protocol === location.protocol ? u.href : null;
    } catch { return null; }
  }

  function followLink(href) {
    if (!href.startsWith("#")) { window.open(href, "_blank", "noopener"); return; }
    if (fs.open) fs.close();
    let id = href.slice(1);
    try { id = decodeURIComponent(id); } catch {}
    const target = !id ? null : document.getElementById(`user-content-${id}`) ||
      out.querySelector(`[id="${CSS.escape(id)}"], a[name="${CSS.escape(id)}"]`);
    const behavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
    if (!id) $("scroll").scrollTo({ top: 0, behavior });
    else if (target && out.contains(target)) target.scrollIntoView({ behavior, block: "start" });
  }

  function linkDiagram(el) {
    el.querySelectorAll(".diagram-body svg a").forEach((a) => {
      const href = safeHref(a.getAttribute("href") || a.getAttribute("xlink:href") || "");
      a.removeAttribute("xlink:href");
      if (!href) { a.removeAttribute("href"); return; }
      a.setAttribute("href", href);
      if (!href.startsWith("#")) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      }
    });
  }

  out.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    followLink(a.getAttribute("href"));
  });

  out.addEventListener("click", async (e) => {
    const btn = e.target.closest(".copy");
    if (!btn) return;
    const code = btn.closest(".codeblock").querySelector("code").innerText;
    try { await navigator.clipboard.writeText(code); btn.textContent = "Copied"; }
    catch { btn.textContent = "Copy blocked"; }
    setTimeout(() => (btn.textContent = "Copy"), 1400);
  });

  function setView(v) {
    main.dataset.view = v;
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    store.set(VIEW_KEY, v);
  }
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));

  // Editing commands (and their undo history) only work on a focused textarea. In Preview
  // view the editor is display:none, so lay it out off-screen for the duration of `fn`.
  function withEditor(fn) {
    const pane = src.closest(".pane-editor");
    const hidden = !src.offsetParent;
    const prev = document.activeElement;
    if (hidden) pane.classList.add("ghost");
    try {
      src.focus({ preventScroll: true });
      return document.activeElement === src ? fn() : false;
    } finally {
      if (hidden) {
        pane.classList.remove("ghost");
        if (prev && prev !== src && prev !== document.body) prev.focus({ preventScroll: true });
        else src.blur();
      }
    }
  }

  // Replace the editor's text as an edit (not by assigning .value), so Ctrl+Z can undo it.
  function replaceAll(t) {
    const ok = withEditor(() => {
      src.select();
      return t ? document.execCommand("insertText", false, t) : (src.value === "" || document.execCommand("delete"));
    });
    if (!ok) src.value = t;
    src.setSelectionRange(0, 0);
    src.scrollTop = 0;
  }

  // Ctrl+Z / Ctrl+Y (Ctrl+Shift+Z) outside the editor — e.g. in Preview view or the diagram
  // viewer — still undo/redo the document.
  document.addEventListener("keydown", (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    const cmd = k === "z" ? (e.shiftKey ? "redo" : "undo") : k === "y" && !e.shiftKey ? "redo" : null;
    if (!cmd || e.target === src || e.target.closest?.("input, textarea, [contenteditable]")) return;
    e.preventDefault();
    if (fs.open) fs.close(); // the modal makes the editor inert, so it couldn't take focus
    withEditor(() => document.execCommand(cmd)); // fires "input" → re-render + save
  });
  function loadText(t) { replaceAll(t); clearHighlight(); render(); store.set(STORE_KEY, t); }
  $("sample").addEventListener("click", () => loadText($("sample-md").textContent.trim() + "\n"));
  $("clear").addEventListener("click", () => loadText(""));
  $("file").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (f) loadText(await f.text());
    e.target.value = "";
  });

  // PDF: re-render diagrams in light colours, then open the print dialog ("Save as PDF").
  $("pdf").addEventListener("click", async () => {
    clearTimeout(timer);
    printing = true;
    await render();
    const prevTitle = document.title;
    const h1 = out.querySelector("h1");
    if (h1) document.title = h1.textContent.trim();
    statusEl.textContent = "Choose “Save as PDF”";
    try { window.print(); }
    catch { statusEl.textContent = "Printing is blocked here — open index.html directly"; }
    document.title = prevTitle;
    printing = false;
    render();
  });

  document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
  document.addEventListener("drop", async (e) => {
    e.preventDefault();
    document.body.classList.remove("dropping");
    const f = e.dataTransfer.files[0];
    if (f) loadText(await f.text());
  });

  // Re-render diagrams when the theme flips
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---------- Boot ---------- */
  const savedView = store.get(VIEW_KEY);
  if (savedView) setView(savedView);
  const draft = store.get(STORE_KEY);
  src.value = draft && draft.trim() ? draft : $("sample-md").textContent.trim() + "\n";
  render();
})();
</script>
